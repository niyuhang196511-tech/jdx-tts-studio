[project]
name = "jdx-backend"
version = "0.1.2"
description = "Jdx TTS Studio local project and remote synthesis service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "httpx[socks]>=0.28,<1",
  "websockets>=15,<16",
  "python-socks[asyncio]>=2.7,<3",
  "python-multipart>=0.0.20",
  "pysubs2>=1.8,<2",
  "numpy>=2.2,<3",
  "soundfile>=0.13,<1",
  "platformdirs>=4.3,<5"
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "pyinstaller>=6.12,<7", "imageio-ffmpeg>=0.6,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jdx_backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
