[package]
name = "jdx-tts-studio"
version = "0.1.2"
description = "Jdx TTS Studio desktop application"
authors = ["Jdx TTS Studio"]
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "jdx_tts_studio"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.5", features = [] }

[dependencies]
tauri = { version = "=2.12.6", features = [] }
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-dialog = "=2.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring-core = "=1.0.1"
open = "5"
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
zbus-secret-service-keyring-store = { version = "=1.0.1", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "=1.1.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
